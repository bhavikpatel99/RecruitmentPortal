<div class="auth-wrapper">
  <div class="card auth-card">
    <h1 class="text-center">Create Account</h1>
    <p class="text-center muted mb-4">Register to apply as a candidate</p>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="fullName">Full Name <span class="required-mark">*</span></label>
        <input id="fullName" type="text" formControlName="fullName" placeholder="Jane Doe" required
               [class.invalid]="f.fullName.touched && f.fullName.invalid" />
        <div class="error-text" *ngIf="f.fullName.touched && f.fullName.invalid">
          Full name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required-mark">*</span></label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" required
               [class.invalid]="f.email.touched && f.email.invalid" />
        <div class="error-text" *ngIf="f.email.touched && f.email.invalid">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required-mark">*</span></label>
        <input id="password" type="password" formControlName="password" placeholder="At least 8 characters" required
               [class.invalid]="f.password.touched && f.password.invalid" />
        <div class="error-text" *ngIf="f.password.touched && f.password.errors?.['required']">
          Password is required.
        </div>
        <div class="error-text" *ngIf="f.password.touched && !f.password.errors?.['required'] && f.password.errors?.['minlength']">
          Password must be at least 8 characters.
        </div>
        <div class="error-text" *ngIf="f.password.touched && !f.password.errors?.['required'] && !f.password.errors?.['minlength'] && f.password.errors?.['pattern']">
          Password must include an uppercase letter, a lowercase letter, and a digit.
        </div>
      </div>

      <button type="submit" class="btn btn-block" [disabled]="submitting || form.invalid">
        {{ submitting ? 'Creating account…' : 'Register' }}
      </button>
    </form>

    <p class="text-center mt-4 muted">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
